server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # Revalidate on every load so a redeploy reaches open phones straight away.
        add_header Cache-Control "no-cache";
    }
}
