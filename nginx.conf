server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Visitors are not logged here. The app states that its server keeps no IP
    # addresses, and the default log format records X-Forwarded-For.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # Docker's DNS. Resolving per request (via the variable below) means a
    # recreated API container with a new address does not leave us returning 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sync mailbox sidecar. Bodies are encrypted in the browser before they get here.
    location /api/ {
        set $api http://billable-api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        client_max_body_size 400k;
    }

    # Served by the reverse proxy in front in production. Answer 404 here so a
    # local run does not fall through to index.html served as CSS.
    location /shared-footer/ {
        return 404;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # Revalidate on every load so a redeploy reaches open phones straight away.
        add_header Cache-Control "no-cache";
        # The page holds a sync passphrase in localStorage, so no third-party or
        # inline script may run. The one hash is the shared footer's onerror handler.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-9f8ZK5epjuMsYtXFjPqrgJI0L4QOAUYmJdHtT+RSH/c='; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
