server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Visitors are not logged here. The app states that its server keeps no IP
    # addresses, and the default log format records X-Forwarded-For.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # sync:start
    # Encrypted sync mailbox sidecar, only in builds made with ENABLE_SYNC=true.
    # Docker's DNS, resolved per request (via the variable), so a recreated API
    # container with a new address does not leave us returning 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ^~ /api/ {
        set $api http://billable-api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        client_max_body_size 400k;
    }
    # sync:end
    # nosync:start
    # No sync in this build, so there is no API: nothing on this site accepts data.
    location ^~ /api/ {
        return 404;
    }
    # nosync:end

    # Served by the reverse proxy in front in production. Answer 404 here so a
    # local run does not fall through to index.html served as CSS.
    location ^~ /shared-footer/ {
        return 404;
    }

    # Files are served only if they exist. Without this, the page fallback
    # below would answer a missing file (say, /js/sync.js in a build without
    # sync) with index.html and a 200, which makes "not in this build"
    # impossible to check from outside.
    location ~* \.(?:js|css|png|svg|ico|webmanifest|json|txt|map)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The service worker's own policy. A worker's fetches are governed by
    # connect-src, and this one must fetch this site's files to cache them for
    # offline use, so it alone gets connect-src 'self'. It loads nothing else.
    location = /sw.js {
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self'" always;
        add_header Cache-Control "no-cache, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # Revalidate on every load so a redeploy reaches open phones straight
        # away. no-transform stops the CDN in front injecting its own scripts
        # (bot detection, analytics) into the page.
        add_header Cache-Control "no-cache, no-transform";
        # Enforces "nothing leaves the browser": the page may load only this
        # site's own files and may open no connections at all (connect-src is
        # 'none' unless the build includes sync, then 'self').
        add_header Content-Security-Policy "default-src 'self'; connect-src __CONNECT_SRC__; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
