server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sync mailbox sidecar. Bodies are encrypted in the browser before they get here.
    location /api/ {
        proxy_pass http://billable-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        client_max_body_size 400k;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # Revalidate on every load so a redeploy reaches open phones straight away.
        add_header Cache-Control "no-cache";
        # The page holds a sync passphrase in localStorage, so no third-party or
        # inline script may run. The one hash is the shared footer's onerror handler.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-9f8ZK5epjuMsYtXFjPqrgJI0L4QOAUYmJdHtT+RSH/c='; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
