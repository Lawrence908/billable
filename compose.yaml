networks:
  web:
    external: true
    name: homelab-web
  # The API's own network: only the front container shares it.
  backend:
    internal: true

services:
  billable:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TIME: ${BUILD_TIME:-unknown}
        BUILD_ID: ${BUILD_ID:-0}
        ENABLE_SYNC: ${ENABLE_SYNC:-false}
    image: billable:latest
    container_name: billable
    restart: unless-stopped
    networks:
      - web
      - backend
    ports:
      - "8175:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Encrypted sync mailboxes. Only runs with ENABLE_SYNC=true (the "sync"
  # profile; deploy.sh selects it). No host port and not on the shared
  # network: reachable only through the front container's /api/ prefix.
  billable-api:
    profiles: ["sync"]
    build:
      context: ./api
      dockerfile: Dockerfile
    image: billable-api:latest
    container_name: billable-api
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    networks:
      - backend
    volumes:
      - ./data:/app/data
    environment:
      # Set by Cloudflare at the edge. Leave empty if not behind Cloudflare.
      - CLIENT_IP_HEADER=Cf-Connecting-Ip
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
