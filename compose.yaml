networks:
  web:
    external: true
    name: homelab-web

services:
  billable:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TIME: ${BUILD_TIME:-unknown}
        BUILD_ID: ${BUILD_ID:-0}
    image: billable:latest
    container_name: billable
    restart: unless-stopped
    networks:
      - web
    ports:
      - "8175:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
